[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-strategy-lab"
description = "F1 race strategy simulator: tyre degradation, pit-stop strategies and Monte Carlo."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Matvey" }]
dynamic = ["version", "dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
version = { attr = "f1lab.__version__" }
# requirements*.txt are the single source of truth for dependencies.
dependencies = { file = ["requirements.txt"] }
optional-dependencies = { dev = { file = ["requirements-dev.txt"] } }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "D",   # pydocstyle: every public function has a docstring
    "ANN", # flake8-annotations: every function has type hints
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]
ignore = [
    "W191", "D206", "D300",            # conflict with ruff format
    "RUF001", "RUF002", "RUF003",      # allow Cyrillic in strings, docstrings and comments
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"notebooks/**" = ["D", "ANN"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
