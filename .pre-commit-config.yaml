# Install once: pre-commit install
# Run on everything: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # API fixtures are stored byte-for-byte as the HTTP cache writes them.
      - id: trailing-whitespace
        exclude: ^tests/fixtures/.*\.json$
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/.*\.json$
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # Keep rev in sync with the ruff version in requirements-dev.txt.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
